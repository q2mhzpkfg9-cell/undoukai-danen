<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>運動会 団演 動画</title>
<style>
  :root { --bg:#f6f3ec; --card:#fff; --ink:#2b2a28; --sub:#7a756c; --accent:#e0703a; --line:#e6e0d4; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:"Hiragino Maru Gothic ProN","Hiragino Sans",system-ui,sans-serif; padding:24px 16px 48px; }
  main { max-width:880px; margin:0 auto; }
  h1 { font-size:1.5rem; margin:0 0 4px; }
  .lead { color:var(--sub); margin:0 0 20px; font-size:.9rem; }
  button { font:inherit; font-size:.95rem; padding:10px 16px; border-radius:10px; border:1px solid var(--line); background:#fff; cursor:pointer; color:inherit; }
  button.on { background:var(--ink); color:#fff; border-color:var(--ink); }
  .list { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:10px; margin-bottom:16px; }
  .item { text-align:left; padding:14px 16px; }
  .item small { display:block; color:var(--sub); margin-top:2px; }
  .item.active { border-color:var(--accent); box-shadow:0 0 0 2px var(--accent) inset; }
  .stage { background:#000; border-radius:12px; overflow:hidden; aspect-ratio:16/9; }
  video { width:100%; height:100%; display:block; background:#000; }
  .tools { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-top:12px; }
  .tools .label { color:var(--sub); font-size:.85rem; margin-right:2px; }
  .note { color:var(--sub); font-size:.8rem; margin-top:16px; }
</style>
</head>
<body>
<main>
  <h1>🏃 運動会 団演 動画</h1>
  <p class="lead">教職員向け・持ち出し厳禁。練習の確認用に再生してください。</p>
  <div class="list" id="list"></div>
  <div class="stage"><video id="video" controls playsinline preload="metadata" controlsList="nodownload"></video></div>
  <div class="tools">
    <span class="label">速さ</span>
    <button data-rate="0.5">0.5倍</button>
    <button data-rate="0.75">0.75倍</button>
    <button data-rate="1" class="on">ふつう</button>
  </div>
  <p class="note">※ 切り替えても速さはそのまま引き継がれます。</p>
</main>
<script>
const VIDEOS = [
  { id:'zenkei', title:'全景ver', sub:'校舎から全体を撮影', src:'media/zenkei.mp4' },
  { id:'chorei', title:'朝礼台ver', sub:'朝礼台から撮影', src:'media/chorei.mp4' },
  { id:'v1014', title:'1014版', sub:'10/14 撮影', src:'media/v1014.mp4' },
  { id:'v1015a', title:'1015版（体育館）', sub:'10/15 撮影', src:'media/v1015a.mp4' },
  { id:'v1015b', title:'1015版（運動場）', sub:'10/15 撮影', src:'media/v1015b.mp4' },
];
const video = document.getElementById('video'), list = document.getElementById('list');
let rate = 1, cur;
video.oncontextmenu = e => e.preventDefault();
function render() {
  list.innerHTML = '';
  VIDEOS.forEach(v => {
    const b = document.createElement('button');
    b.className = 'item' + (cur === v.id ? ' active' : '');
    b.innerHTML = `<b>${v.title}</b><small>${v.sub}</small>`;
    b.onclick = () => select(v);
    list.appendChild(b);
  });
}
function select(v) {
  if (cur === v.id) return;
  cur = v.id; render();
  video.src = v.src; video.playbackRate = rate;
}
video.onloadedmetadata = () => { video.playbackRate = rate; };
document.querySelectorAll('[data-rate]').forEach(b => b.onclick = () => {
  rate = +b.dataset.rate; video.playbackRate = rate;
  document.querySelectorAll('[data-rate]').forEach(x => x.classList.toggle('on', x === b));
});
select(VIDEOS[0]);
</script>
</body>
</html>
